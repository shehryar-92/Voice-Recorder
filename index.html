<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Voice Snap — record, play back, download</title>
<meta name="description" content="A privacy-first voice recorder. Everything happens in your browser — nothing is uploaded or stored." />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; media-src blob:; script-src 'self';" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body data-app-state="idle">

<header class="site-header">
  <span class="wordmark">Voice Snap</span>
</header>

<main class="app">

  <!-- IDLE: nothing recorded yet -->
  <section class="state state--idle" id="state-idle" aria-hidden="true">
    <button type="button" class="record-button" id="record-button" aria-label="Start recording">
      <svg viewBox="0 0 24 24" width="32" height="32" fill="none" aria-hidden="true">
        <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M19 11a7 7 0 0 1-14 0M12 18v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <p class="state-note">Nothing recorded yet.</p>
  </section>

  <!-- RECORDING: capture in progress -->
  <section class="state state--recording" id="state-recording" aria-hidden="true">
    <div class="status-row">
      <span class="status-dot" aria-hidden="true"></span>
      <span class="status-label">Recording…</span>
    </div>
    <div class="timer" id="timer" role="timer" aria-label="Recording duration">00:00</div>
    <button type="button" class="stop-button" id="stop-button" aria-label="Stop recording">
      <span class="stop-icon" aria-hidden="true"></span>
    </button>
    <p class="state-note">Click stop to save your track.</p>
  </section>

  <!-- STOPPED: playback, download, discard -->
  <section class="state state--stopped" id="state-stopped" aria-hidden="true">
    <p class="eyebrow">Recording ready</p>
    <div class="timer timer--static" id="final-duration">00:00</div>

    <div class="player-card">
      <button type="button" class="play-button" id="play-button" aria-label="Play recording">
        <svg class="icon-play" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path d="M6 4.5v15l13-7.5-13-7.5Z"/>
        </svg>
        <svg class="icon-pause" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true" hidden>
          <path d="M7 4.5h4v15H7v-15Zm6 0h4v15h-4v-15Z"/>
        </svg>
      </button>
      <div class="scrub-wrap">
        <input type="range" class="scrub-bar" id="scrub-bar" min="0" max="0" step="0.1" value="0" aria-label="Playback position" />
        <div class="scrub-times">
          <span id="elapsed-time">00:00</span>
          <span id="total-time">00:00</span>
        </div>
      </div>
    </div>

    <audio id="audio-player" preload="metadata"></audio>

    <button type="button" class="download-button" id="download-button">Download</button>
    <button type="button" class="discard-link" id="discard-button">Discard / Re-record</button>
  </section>

  <!-- PERMISSION DENIED -->
  <section class="state state--permission-denied" id="state-permission-denied" aria-hidden="true">
    <h1 class="denied-title">Permission needed</h1>
    <p class="state-note" id="denied-message">Microphone access is required to record audio.</p>
    <button type="button" class="retry-button" id="retry-button">Retry</button>
  </section>

</main>

<footer class="site-footer">
  <p>Everything happens in your browser. No audio is uploaded or stored — closing this tab deletes your recording.</p>
</footer>

<script src="recorder-helpers.js"></script>
<script src="recorder.js"></script>
</body>
</html>
